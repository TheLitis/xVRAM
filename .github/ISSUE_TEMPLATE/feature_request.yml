name: Feature request
description: Propose a workload, integration, or backend capability.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workload or limitation should xVRAM address?
    validations:
      required: true
  - type: textarea
    id: working_set
    attributes:
      label: Working-set information
      description: Explain the operation sequence, access ranges, reuse, and physical VRAM target.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed integration
      description: Describe the API, library, framework, or instrumentation boundary.
