name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Build and install Python frontends
        run: >-
          python -m pip install ./python &&
          python -c "import xvram; assert xvram.TORCH_ALLOCATOR_ABI_VERSION == 1" &&
          xvram-compat-audit --help &&
          xvram-compat-audit --version &&
          python -m xvram.compat_audit_observations --help &&
          python -m xvram.compat_audit_sources --help &&
          python -m xvram.compat_audit_binary --help &&
          python -m xvram.compat_audit_bindings --help &&
          python -m xvram.compat_launch_probe --help &&
          python -m xvram.compat_launch_census --help &&
          python -c "from xvram.compat_audit_sources import load_profile; assert len(load_profile()[0]['files']) == 18"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify Phase 2 targets and contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.](residency|cache-bench|schema)'

      - name: Verify Phase 3 SDK, GEMM, and contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.](sdk|gemm)'

      - name: Verify Phase 4 PyTorch adapter contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.]torch'

      - name: Verify Phase 5 compression, codec, and frozen contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.](compression|nvcomp|(schema|abi)[.]hash-contract|sdk|torch-inference-v2[.]json-contract)'

      - name: Test complete no-GPU suite
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error

      - name: Verify Phase 6b diagnostic audit without GPU or profiling tools
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.]compat-audit[.]'

      - name: Enable explicit CUDA compatibility profile after default-OFF regression
        run: >-
          cmake -S . -B build
          -DXVRAM_BUILD_CUDA_COMPAT=ON
          -DXVRAM_FETCH_CUBLAS_REDIST=ON

      - name: Build opt-in Driver launch diagnostic and reject an unpinned host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaInclude = (Select-String -Path build/CMakeCache.txt -Pattern '^XVRAM_CUDA_INCLUDE_DIR:PATH=(.*)$').Matches.Groups[1].Value
          if (-not $cudaInclude) { throw 'CUDA header path missing from configured build' }
          cmake -S src/compat_launch_probe -B build-launch-probe -A x64 "-DXVRAM_PROBE_CUDA_INCLUDE=$cudaInclude"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-launch-probe --config ${{ matrix.build_type }} --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import ctypes,pathlib; p=pathlib.Path('build-launch-probe/${{ matrix.build_type }}/xvram_driver_launch_probe.dll').resolve(); lib=ctypes.WinDLL(str(p)); assert lib.InitializeInjection()==0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S src/compat_launch_probe -B build-launch-census -A x64 "-DXVRAM_PROBE_CUDA_INCLUDE=$cudaInclude" -DXVRAM_PROBE_CENSUS=ON -DXVRAM_PROBE_FETCH_CUPTI=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-launch-census --config ${{ matrix.build_type }} --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import ctypes,pathlib; p=pathlib.Path('build-launch-census/${{ matrix.build_type }}/xvram_driver_launch_census.dll').resolve(); lib=ctypes.WinDLL(str(p)); assert lib.InitializeInjection()==0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S src/compat_launch_probe -B build-launch-census -DXVRAM_PROBE_LEGACY_RESOLVER=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-launch-census --config ${{ matrix.build_type }} --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import ctypes,pathlib; p=pathlib.Path('build-launch-census/${{ matrix.build_type }}/xvram_driver_launch_census.dll').resolve(); lib=ctypes.WinDLL(str(p)); assert lib.InitializeInjection()==0"

      - name: Build CUDA compatibility profile
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test complete no-GPU suite with compatibility ON
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error

      - name: Install SDK package
        run: >-
          cmake --install build --config ${{ matrix.build_type }}
          --prefix build/install

      - name: Verify relocated hash-pinned app-local cuBLAS pair
        run: >-
          python tests/contract/cuda_compat_relocated_contract.py
          --install build/install --build build --configuration ${{ matrix.build_type }}

      - name: Verify relocated app-local nvCOMP package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = (Resolve-Path build/install).Path
          $relocated = Join-Path $env:RUNNER_TEMP "xvram-relocated-${{ matrix.build_type }}"
          Copy-Item -LiteralPath $source -Destination $relocated -Recurse
          $bin = Join-Path $relocated "bin"
          $bench = Join-Path $bin "xvram-compression-bench.exe"
          if (-not (Test-Path -LiteralPath $bench -PathType Leaf)) {
            throw "relocated compression benchmark is missing"
          }
          & $bench --version
          if ($LASTEXITCODE -ne 0) { throw "relocated compression benchmark failed to start" }
          $helperSource = Get-ChildItem -Path build -Recurse `
            -Filter "xvram-nvcomp-load-test-helper.exe" |
            Where-Object { $_.FullName -notmatch '[\\/]_deps[\\/]' } |
            Select-Object -First 1
          if ($null -eq $helperSource) { throw "nvCOMP load-test helper is missing" }
          $helper = Join-Path $bin "xvram-nvcomp-load-test-helper.exe"
          Copy-Item -LiteralPath $helperSource.FullName -Destination $helper
          $loadOutput = & $helper
          if ($LASTEXITCODE -ne 0) { throw "app-local nvCOMP loader check failed" }
          $load = $loadOutput | ConvertFrom-Json
          if ($load.source -ne "app_local") { throw "nvCOMP source is not app-local" }
          if ($load.version -lt 5300 -or $load.version -ge 6000) {
            throw "unexpected nvCOMP version $($load.version)"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath (Join-Path $bin "nvcomp64_5.dll")).Hash.ToLowerInvariant()
          if ($actualHash -ne $load.library_sha256) {
            throw "relocated nvCOMP library hash differs from the configured staged library"
          }

      - name: Verify relocated app-local nvCOMP package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          relocated="${RUNNER_TEMP}/xvram-relocated-${{ matrix.build_type }}"
          cp -a build/install "$relocated"
          test -x "$relocated/bin/xvram-compression-bench"
          "$relocated/bin/xvram-compression-bench" --version
          helper_source="$(find build -type f -name xvram-nvcomp-load-test-helper \
            ! -path '*/_deps/*' -print -quit)"
          test -n "$helper_source"
          cp "$helper_source" "$relocated/bin/xvram-nvcomp-load-test-helper"
          load_json="$(env -u LD_LIBRARY_PATH \
            "$relocated/bin/xvram-nvcomp-load-test-helper")"
          python - "$relocated/lib/libnvcomp.so.5" "$load_json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          library = pathlib.Path(sys.argv[1]).resolve()
          observed = json.loads(sys.argv[2])
          assert observed["source"] == "app_local", observed
          assert 5300 <= observed["version"] < 6000, observed
          actual = hashlib.sha256(library.read_bytes()).hexdigest()
          assert observed["library_sha256"] == actual, (observed, actual)
          PY

      - name: Verify compression no-driver report (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bench = "build/${{ matrix.build_type }}/xvram-compression-bench.exe"
          if (-not (Test-Path -LiteralPath $bench -PathType Leaf)) {
            $bench = "build/xvram-compression-bench.exe"
          }
          $report = "build/compression-no-driver-${{ matrix.build_type }}.json"
          & $bench --logical-size 1GiB --scenario compressible-read `
            --compact-json --no-text --json $report
          if ($LASTEXITCODE -ne 23) {
            throw "compression no-driver run exited $LASTEXITCODE instead of 23"
          }
          $schemaCheck = @'
          import json
          import pathlib
          import sys
          import jsonschema

          schema = json.loads(pathlib.Path(sys.argv[1]).read_text())
          report = json.loads(pathlib.Path(sys.argv[2]).read_text())
          jsonschema.Draft202012Validator(schema).validate(report)
          assert report["outcome"]["exit_code"] == 23
          assert report["outcome"]["reason"] in {
              "device_unavailable", "cuda_symbols_unavailable", "cuda_initialization_failed"
          }, report["outcome"]
          assert report["outcome"]["stage"] == "preflight", report["outcome"]
          '@
          $schemaCheck | python - schemas/adaptive-compression-report-v1.schema.json $report

      - name: Verify compression no-driver report (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report="build/compression-no-driver-${{ matrix.build_type }}.json"
          set +e
          build/xvram-compression-bench --logical-size 1GiB --scenario compressible-read \
            --compact-json --no-text --json "$report"
          status=$?
          set -e
          test "$status" -eq 23
          python - schemas/adaptive-compression-report-v1.schema.json "$report" <<'PY'
          import json
          import pathlib
          import sys
          import jsonschema

          schema = json.loads(pathlib.Path(sys.argv[1]).read_text())
          report = json.loads(pathlib.Path(sys.argv[2]).read_text())
          jsonschema.Draft202012Validator(schema).validate(report)
          assert report["outcome"]["exit_code"] == 23
          assert report["outcome"]["reason"] in {
              "device_unavailable", "cuda_symbols_unavailable", "cuda_initialization_failed"
          }, report["outcome"]
          assert report["outcome"]["stage"] == "preflight", report["outcome"]
          PY

      - name: Configure installed C and C++ consumers (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S tests/package_consumer -B build/package-consumer -A x64
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install
          -DXVRAM_BUILD_TREE=${{ github.workspace }}/build

      - name: Configure installed C and C++ consumers (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S tests/package_consumer -B build/package-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install
          -DXVRAM_BUILD_TREE=${{ github.workspace }}/build

      - name: Build installed-package consumers
        run: >-
          cmake --build build/package-consumer --config ${{ matrix.build_type }}
          --parallel

      - name: Test installed-package consumers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\install\bin;$env:PATH"
          ctest --test-dir build/package-consumer --build-config ${{ matrix.build_type }} `
            --output-on-failure --no-tests=error

      - name: Test installed-package consumers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build/install/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/package-consumer --build-config ${{ matrix.build_type }} \
            --output-on-failure --no-tests=error

  pytorch-stable-abi:
    name: PyTorch 2.11 -> 2.13 Stable ABI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up compatible Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CPU PyTorch and test dependencies
        run: >-
          python -m pip install --requirement tests/requirements.txt &&
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0 &&
          python -c "import torch; assert torch.__version__.split('+', 1)[0] == '2.11.0'; assert torch.version.cuda is None"

      - name: Configure Stable-ABI bridge (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_BUILD_TORCH_RUNTIME=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Configure Stable-ABI bridge (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_BUILD_TORCH_RUNTIME=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Build Stable-ABI bridge and control tests
        run: >-
          cmake --build build --config Release --parallel
          --target xvram_torch_runtime xvram-torch-runtime-control-tests xvram-compat-audit-core-tests
          xvram-launch-probe-core-tests

      - name: Verify Stable-ABI build, exports, registration, and control table
        run: >-
          ctest --test-dir build --build-config Release
          --output-on-failure --no-tests=error
          -R '^xvram[.]torch-runtime[.]'

      - name: Upgrade runtime to target PyTorch 2.13 without rebuilding bridge
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.13.0 &&
          python -c "import torch; assert torch.__version__.split('+', 1)[0] == '2.13.0'; assert torch.version.cuda is None"

      - name: Verify 2.11-built bridge and v2 control table on PyTorch 2.13
        run: >-
          ctest --test-dir build --build-config Release
          --output-on-failure --no-tests=error
          -R '^xvram[.]torch-runtime[.](stable-load|control)$'

      - name: Verify diagnostic audit remains independent of PyTorch and CUDA
        run: >-
          ctest --test-dir build --build-config Release
          --output-on-failure --no-tests=error
          -R '^xvram[.]compat-audit[.]'

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Build and install Python frontends
        run: >-
          python -m pip install ./python &&
          python -c "import xvram; assert xvram.TORCH_ALLOCATOR_ABI_VERSION == 1" &&
          xvram-compat-audit --help &&
          xvram-compat-audit --version

      - name: Configure Clang ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_BUILD_CUDA_COMPAT=ON
          -DXVRAM_FETCH_CUBLAS_REDIST=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Build with sanitizers
        run: cmake --build build --parallel

      - name: Verify Phase 2 targets and contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.](residency|cache-bench|schema)'

      - name: Verify Phase 3 SDK, GEMM, and contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.](sdk|gemm)'

      - name: Verify Phase 4 PyTorch adapter contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.]torch'

      - name: Verify Phase 5 compression and codec contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.](compression|nvcomp|(schema|abi)[.]hash-contract|sdk|torch-inference-v2[.]json-contract)'

      - name: Test complete no-GPU suite with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Verify Phase 6b diagnostic audit without GPU or profiling tools
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.]compat-audit[.]'
