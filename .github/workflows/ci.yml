name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify Phase 2 targets and contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.](residency|cache-bench|schema)'

      - name: Verify Phase 3 SDK, GEMM, and contracts
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error
          -R '^xvram[.](sdk|gemm)'

      - name: Test complete no-GPU suite
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error

      - name: Install SDK package
        run: >-
          cmake --install build --config ${{ matrix.build_type }}
          --prefix build/install

      - name: Configure installed C and C++ consumers (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S tests/package_consumer -B build/package-consumer -A x64
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install

      - name: Configure installed C and C++ consumers (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S tests/package_consumer -B build/package-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install

      - name: Build installed-package consumers
        run: >-
          cmake --build build/package-consumer --config ${{ matrix.build_type }}
          --parallel

      - name: Test installed-package consumers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\install\bin;$env:PATH"
          ctest --test-dir build/package-consumer --build-config ${{ matrix.build_type }} `
            --output-on-failure --no-tests=error

      - name: Test installed-package consumers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build/install/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/package-consumer --build-config ${{ matrix.build_type }} \
            --output-on-failure --no-tests=error

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Configure Clang ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DXVRAM_BUILD_TESTS=ON
          -DXVRAM_WARNINGS_AS_ERRORS=ON

      - name: Build with sanitizers
        run: cmake --build build --parallel

      - name: Verify Phase 2 targets and contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.](residency|cache-bench|schema)'

      - name: Verify Phase 3 SDK, GEMM, and contracts with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R '^xvram[.](sdk|gemm)'

      - name: Test complete no-GPU suite with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error
