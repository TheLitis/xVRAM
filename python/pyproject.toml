[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xvram"
version = "0.1.0.dev0"
description = "Conservative PyTorch integration for the xVRAM CUDA memory runtime"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["xvram*"]
